<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>the weather</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body class="light">
    <h1>the weather</h1>

    <div class="theme-box">
      <button id="themeBtn">
        <img src="./images/bedtime.svg" width="20" /> Dark Mode
      </button>
    </div>

    <div class="weather-card">
      <div class="search-box">
        <img class="search-loc" src="./images/location-icon.svg" />
        <input
          id="searchInput"
          type="text"
          placeholder="Search a location..."
        />
        <button id="searchBtn"><img src="./images/search.svg" /></button>
      </div>

      <h2 class="city-text">Oslo</h2>

      <div class="main-row">
        <div class="temp-text">18°C</div>
        <img src="./images/cloud.svg" class="wx-icon" />
      </div>

      <h3 class="cond-text">Cloudy</h3>

      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-name">Humidity</div>
          <div class="detail-value">60%</div>
        </div>
        <div class="detail-item">
          <div class="detail-name">Wind Speed</div>
          <div class="detail-value">5 km/h</div>
        </div>
      </div>
    </div>
  </body>
</html>
