<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>

  <body class="theme-light">
    <header class="topbar">
      <button id="themeButton" class="theme-button" type="button">
        <img id="themeIcon" class="icon" src="./images/bedtime.svg" alt="" />
        <span id="themeLabel">Dark mode</span>
      </button>
    </header>

    <main class="page">
      <h1 class="title">the weather</h1>

      <section class="card" aria-label="Weather">
        <form id="searchForm" class="search" autocomplete="off">
          <img
            class="icon icon-location"
            src="./images/location-icon.svg"
            alt=""
          />

          <input
            id="cityInput"
            class="search-input"
            name="city"
            type="text"
            placeholder="Search a city..."
            required
          />

          <button class="search-button" type="submit" aria-label="Search">
            <img class="icon" src="./images/search.svg" alt="" />
          </button>
        </form>

        <h2 id="cityName" class="city"></h2>

        <div class="now">
          <div id="temperature" class="temp"></div>
          <img
            id="weatherIcon"
            class="weather-icon"
            src="./images/cloud.svg"
            alt=""
          />
        </div>

        <p id="condition" class="condition"></p>

        <div class="stats">
          <div class="stat">
            <div class="stat-name">Humidity</div>
            <div id="humidity" class="stat-value"></div>
          </div>

          <div class="stat">
            <div class="stat-name">Wind</div>
            <div id="wind" class="stat-value"></div>
          </div>
        </div>

        <p id="error" class="error" hidden></p>
      </section>
    </main>
  </body>
</html>
